[project]
name = "Pytition"
version = "3.0.0"
description = "Django app for self-hosted privacy-friendly online petitions."
authors = [
    { name = "Yann Sionneau", email = "yann@sionneau.net" },
    { name = "Sébastien PONT", email = "contact@spont.me" },
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "BSD 3-Clause" }
dependencies = [
    "django>=5.2.7",
    "django-colorfield==0.10.1",
    "django-tinymce==3.6.1",
    "django-mailer==2.3",
    "django-maintenance-mode",
    "django-phonenumber-field[phonenumbers]==6.3.0",
    "requests~=2.0",
    "mysqlclient==2.0.1",
    "django-widget-tweaks==1.4.3",
    "django-formtools==2.2",
    "bcrypt",
    "lxml[html_clean]",
    "uwsgi",
    "psycopg[binary]==3.1.19",
    "python-dotenv>=1.1.1",
    "Pillow>=12.0.0",
    "cssmin>=0.2.0",
    "rjsmin>=1.2.5",
    "cairosvg>=2.8.2",
    "beautifulsoup4>=4.14.2",
]

[tool.pytition.vendors]
bootstrap = "4.3.1"
open-iconic = "1.1.1"
jquery = "3.3.1"
popper = "1.14.6"
jquery-smart-wizard = "4.4.1"
rrssb = "1.14.0"
bs-custom-file-input = "1.3.4"



[tool.pdm]
distribution = false

[tool.pdm.scripts]
manage = "python manage.py"
test-fast = "pdm run manage test apps --parallel auto --keepdb --noinput"
graph-models = "pdm run manage graph_models accounts organizations petitions signatures presets moderation --group-models --verbose-names --inheritance --arrow-shape crow --output docs/source/_static/img/models.svg"
graph-urls = "pdm run manage graph_urls --outfile docs/source/_static/urls.mmd"
# Sphinx - build (HTML)
docs-build = "python manage.py build_docs"
# Sphinx - live reload
docs-live = "sphinx-autobuild docs/source docs/_build/html -a -j auto --host 0.0.0.0 --port 8001 --watch src"
# Docstring coverage
docs-coverage = "interrogate -v -c pyproject.toml src"
# Generate docstring coverage badge
docs-badge = "interrogate -c pyproject.toml src --generate-badge docs/source/_static/img/"

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "ruff>=0.14.1",
    "types-uWSGI>=2.0.0.20250809",
    "lxml-stubs>=0.5.1",
    "docformatter[toml]>=1.7.7",
    "translate-toolkit>=3.16.3",
    "django-extensions>=4.1",
    "graphviz>=0.21",
    "pydotplus>=2.0.2",
]
docs = [
    "coverage==4.5.2",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme",
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "pydocstyle[toml]>=6.3.0",
    "sphinx-autodoc-typehints>=3.5.2",
    "linkify-it-py>=2.0.3",
    "sphinx-multiversion>=0.2.4",
    "sphinx-intl>=2.3.2",
    "interrogate>=1.7.0",
]
typecheck = [
    "django-stubs>=5.2.7",
    "django-stubs-ext>=5.2.7",
    "types-requests>=2.32.4.20250913",
    "types-python-dateutil>=2.9.0.20251008",
    "pyright>=1.1.406",
    "mypy>=1.18.2",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
# Codes of the various linters used by ruff:
# E = pycodestyle errors
# F = pyflakes
# I = isort
# UP = unimported
# B = bandit
# C4 = flake8-comprehensions
# SIM = flake8-simplify
# PTH = flake8-pie
# PL = flake8-pyi
# D = pydocstyle (chosen convention: numpy)
# INT = flake8-gettext checks
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "PL", "D", "INT"]
ignore = [
    "D203", # incompatible avec D211
    "D212", # incompatible avec D213
    "D401", # first line should be in imperative mood; try rephrasing
]

[tool.ruff.lint.flake8-gettext]
# Extend the list to cover pgettext / n(p)gettext / alias _
function-names = [
    "_",
    "gettext",
    "ngettext",
    "pgettext",
    "npgettext",
    "ugettext",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.pydocstyle]
convention = "numpy" # other options: google, pep257

[tool.ruff.format]
docstring-code-format = true # auto-format code blocks in docstrings

[tool.djlint]
profile = "django"
ignore = "H031"    # Ignore warning about missing meta keywords in html tag
use_gitignore = true

# Tool for auto-formatting docstrings
[tool.docformatter]
style = "numpy"
wrap-summaries = 88
wrap-descriptions = 88
pre-summary-newline = true
make-summary-multi-line = false

[tool.interrogate]
fail-under = 80 # minimum percentage of docstring coverage
ignore-magic = true # ignore magic methods (i.e., those starting and ending with double underscores)
ignore-init-method = true # ignore __init__ methods
ignore-init-module = true # ignore __init__.py modules
ignore-module = false # do not ignore modules
ignore-private = true # ignore private members (i.e., those starting with a single underscore)
ignore-semiprivate = true # ignore semi-private members (i.e., those starting with a double underscore)
# ignore tests and docs directories
exclude = ["src/apps/**/tests", "src/apps/**/migrations", "docs", "docs/**"]
source-directories = ["src"] # directories to scan for docstrings
verbose = 2 # verbosity level (0-3)

[tool.pydocstyle]
convention = "numpy" # style guide to follow
# rules to ignore
# D105: Missing docstring in magic method (e.g., __str__, __repr__)
# D107: Missing docstring in __init__
add-ignore = ["D105", "D107"]
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = ["src"]
files = ["src"]
namespace_packages = true
explicit_package_bases = true

warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_equality = true

exclude = "^(build/|dist/|.*/migrations/|.*/staticfiles/|.*/__pycache__/|manage\\.py$)"

# help mypy find django-stubs
[tool.django-stubs]
django_settings_module = "config.settings"
