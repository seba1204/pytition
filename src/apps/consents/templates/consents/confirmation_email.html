{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
    <head>
        <meta charset="UTF-8">
        <title>{% trans "Email Confirmation" %}</title>
        <meta name="description"
              content="{% trans "Confirm your signature by clicking the provided link." %}">
        <meta name="keywords"
              content="{% trans "confirmation, email, signature, petition" %}">
    </head>
    <body>
        <h2>{% trans "Thank you" %} {{ firstname }}!</h2>
        {% blocktrans %}
Now, in order to confirm your signature, you only need to click here :
{% endblocktrans %}
        <a href="{{ url }}">{{ url }}</a>
        <p />
        {% trans "See you soon!" %}
    </body>
</html>
