{% load i18n %}
{% with pct=petition.signature_progress %}
  <div class="mb-4">
    <div class="progress mb-2"
         role="progressbar"
         aria-valuenow="{{ pct }}"
         aria-valuemin="0"
         aria-valuemax="100">
      <div class="progress-bar" style="width: {{ pct }}%;"></div>
    </div>
    <div class="small text-muted">
      {% blocktrans trimmed count sign_nb=petition.signature_number %}
        Already {{ sign_nb }} signature
      {% plural %}
        Already {{ sign_nb }} signatures
      {% endblocktrans %}
    </div>
  </div>
{% endwith %}
