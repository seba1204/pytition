{# Illustration upload field partial #}
{% load i18n %}
<div class="mb-3">
  <label for="{{ form.illustration.id_for_label }}" class="form-label">{% trans "Illustration image" %}</label>
  {{ form.illustration }}
  <div class="form-text">{% trans "Optional. Shown at the top and used for social preview." %}</div>
  <img class="img-fluid mt-3 d-none"
       id="illustration-preview"
       alt="{% trans "Illustration preview" %}"
       width="400"
       height="300">
</div>
