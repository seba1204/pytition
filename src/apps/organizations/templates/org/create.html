{% extends "accounts/base.html" %}
{% load i18n %}
{% block content %}
    <div class="row">
        <div class="col text-center">
            <h2>{% trans "Create an organization" %}</h2>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <form method="post">
                {% csrf_token %}
                {% include "ui/forms/bs4.html" with form=form %}
                <button class="btn btn-success" type="submit">{% trans "Create" %}</button>
            </form>
        </div>
    </div>
{% endblock content %}
